html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #c3e3ff; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0;
	background: #c3e3ff url("index.png") center / cover no-repeat;
	display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
	visibility: hidden;
	font-family: 'Kenney Future', 'Arial Rounded MT Bold', Arial, sans-serif;
}
#status-panel {
	display: none; flex-direction: column; align-items: center; gap: 7px;
	width: min(500px, 86vw); margin-bottom: 1.6vh; padding: 10px 18px 9px;
	background: rgba(28, 28, 38, 0.93); border: 3px solid #ffd500; border-radius: 12px;
	box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
}
#status-row { display: flex; align-items: center; gap: 14px; width: 100%; }
#status-coin { width: 38px; height: 38px; animation: spin 1.1s linear infinite; }
@keyframes spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
#status-text { font-size: 21px; letter-spacing: 1px; text-shadow: 2px 2px 0 #000; flex: 1; }
#status-size { font-family: Arial, sans-serif; font-size: 13px; color: #c9c9d6; }
#status-bar {
	width: 100%; height: 14px; background: #14141c; border: 3px solid #000; border-radius: 10px; overflow: hidden;
}
#status-progress-fill {
	width: 0%; height: 100%; border-radius: 6px;
	background: repeating-linear-gradient(-45deg, #ffd500 0 14px, #f5a300 14px 28px);
	background-size: 40px 100%; animation: stripes 0.8s linear infinite; transition: width 0.25s ease-out;
}
@keyframes stripes { from { background-position: 0 0; } to { background-position: 40px 0; } }
#status-tip { font-family: Arial, sans-serif; font-size: 13px; color: #e6e6ee; min-height: 1.2em; text-align: center; }

#status-notice {
	display: none; margin: 0 2rem 30vh; padding: 1rem; z-index: 1;
	background-color: #5b3943; border: 2px solid #9b3943; border-radius: 0.5rem;
	color: #e0e0e0; font-family: Arial, sans-serif; line-height: 1.3; text-align: center;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9414712,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress-fill');
	const statusText = document.getElementById('status-text');
	const statusSize = document.getElementById('status-size');
	const statusTip = document.getElementById('status-tip');
	const TIPS = [
		'Q and E fire your skills, R unleashes the ultimate.',
		'Every draft gives you one free reroll.',
		'Spears stab straight ahead - line up your enemy.',
		'Standing in a red ring is a bad idea.',
		'Deal damage to charge your ultimate faster.',
		'Two-handed weapons hit harder but swing slower.',
	];
	function startTips() {
		let i = Math.floor(Math.random() * TIPS.length);
		statusTip.textContent = 'Tip: ' + TIPS[i];
		setInterval(() => {
			i = (i + 1) % TIPS.length;
			statusTip.textContent = 'Tip: ' + TIPS[i];
		}, 3500);
	}
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		document.getElementById('status-panel').style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startTips();
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.floor((current / total) * 100));
					statusProgress.style.width = pct + '%';
					statusText.textContent = pct >= 100 ? 'Starting...' : 'Loading ' + pct + '%';
					statusSize.textContent = (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
				} else {
					statusText.textContent = 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
